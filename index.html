 function stopWalk(){walking=false;if(kitty.classList.contains('walk'))kitty.className='cat idle'}
 function choose(){const p=position();const edge=Math.min(p.w/2-55,155);tx=clamp(65+Math.random()*(p.w-130),edge,p.w-edge);ty=clamp(p.h*.38+Math.random()*p.h*.16,145,Math.max(145,p.h-190));walking=true;kitty.className='cat walk';kitty.style.setProperty('--face',tx<p.x?-1:1);say(['啪嗒、啪嗒～白拖鞋出動！','巡邏一下你的療癒小天地 🐾','今天也要慢慢走，喵～'][steps++%3]);}
 function frame(t){requestAnimationFrame(frame);if(!auto||drag||sleeping||Date.now()<pausedUntil)return;if(!last)last=t;let dt=Math.min(40,t-last);last=t;if(!walking){if(t>nextMove)choose();return}const p=position(),dx=tx-p.x,dy=ty-p.y,dist=Math.hypot(dx,dy);if(dist<4){stopWalk();nextMove=t+2400+Math.random()*4500;say('到站！坐下來看看你 ♡');return}const step=Math.min(dist,dt*.065);const x=p.x+dx/dist*step,y=p.y+dy/dist*step;kitty.style.left=x+'px';kitty.style.top=y+'px';bubbleAt(x,y)}
 let nextMove=performance.now()+1600;requestAnimationFrame(frame);
 toggle.onclick=()=>{auto=!auto;last=0;toggle.textContent=auto?'⏸ 暫停自由散步':'🐾 開始自由散步';if(auto){nextMove=performance.now()+600;say('白拖鞋準備出發囉！🐾')}else{stopWalk();say('我乖乖坐著陪你 ♡')}};

 window.addEventListener('choco-mood',()=>{stopWalk();pausedUntil=Date.now()+5500;nextMove=performance.now()+5600});

<style>
/* v1.8: animated emotion cues over the approved 3D character artwork */
.emotion-stage{transition:opacity .35s ease,visibility .35s ease}
.emotion-stage.visible .emotion-card{animation:emotionEnter .45s cubic-bezier(.18,.89,.32,1.28) both}
.emotion-stage.lonely.visible .emotion-card{animation:emotionEnter .45s ease-out both, tinySad 2s .5s ease-in-out infinite}
.emotion-stage.proud.visible .emotion-card{animation:emotionEnter .45s ease-out both, tinyCelebrate .65s .5s ease-in-out 3}
@keyframes emotionEnter{from{opacity:0;transform:translateY(22px) scale(.88)}to{opacity:1;transform:translateY(0) scale(1)}}
.emotion-fx{position:absolute;inset:0;pointer-events:none;overflow:hidden;border-radius:20px}
.emotion-fx .fx{position:absolute;opacity:0;filter:drop-shadow(0 0 5px #ffda76);font-size:clamp(20px,4vw,34px)}
.proud .emotion-fx .star-a{left:34%;top:34%;animation:twinkle 1.1s .6s infinite}
.proud .emotion-fx .star-b{left:58%;top:30%;animation:twinkle 1.1s .85s infinite}
.proud .emotion-fx .shine{left:76%;top:12%;animation:floatSpark 1.6s .4s infinite}
.lonely .emotion-fx .tear{left:26%;top:46%;filter:none;animation:tearFall 2.2s .5s infinite}
.lonely .emotion-fx .heart{left:72%;top:20%;filter:none;animation:softHeart 2.2s .3s infinite}
@keyframes twinkle{0%,100%{opacity:.15;transform:scale(.7)}45%{opacity:1;transform:scale(1.22)}}
@keyframes floatSpark{0%{opacity:0;transform:translateY(16px) scale(.6)}50%{opacity:1}100%{opacity:0;transform:translateY(-24px) scale(1.2)}}
@keyframes tearFall{0%{opacity:0;transform:translateY(-7px)}35%{opacity:.9}100%{opacity:0;transform:translateY(34px)}}
@keyframes softHeart{0%,100%{opacity:.15;transform:scale(.8)}50%{opacity:.7;transform:scale(1.08)}}
@media(prefers-reduced-motion:reduce){.emotion-stage.visible .emotion-card,.emotion-fx .fx{animation:none!important}.emotion-fx .fx{opacity:0!important}}
</style>
<script>
(()=>{
 const stage=document.querySelector('.emotion-stage');if(!stage)return;
 const fx=document.createElement('div');fx.className='emotion-fx';fx.setAttribute('aria-hidden','true');
 fx.innerHTML='<span class="fx star-a">✦</span><span class="fx star-b">✦</span><span class="fx shine">✨</span><span class="fx tear">💧</span><span class="fx heart">♡</span>';
 stage.querySelector('.emotion-card').appendChild(fx);
 // Keep the two stars subtle: they are light glints accompanying the existing one-star-per-eye illustration.
})();
</script>

<style>
/* v1.9: cinematic visual-only mood theater */
.emotion-stage{background:rgba(42,22,24,.72)!important;backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);z-index:100!important}
.emotion-stage .emotion-card{position:relative;isolation:isolate;overflow:hidden;box-shadow:0 25px 90px #2a101c99,0 0 0 1px #ffffff44;border-radius:24px!important}
.emotion-stage .emotion-card::before{content:'';position:absolute;inset:0;z-index:2;pointer-events:none;background:linear-gradient(135deg,#ffffff22,transparent 40%,#ffe6b012);mix-blend-mode:screen}
.emotion-stage.proud .emotion-card{box-shadow:0 22px 90px #ffce6688,0 0 0 2px #ffe3a8}
.emotion-stage.lonely .emotion-card{box-shadow:0 22px 90px #a4c7f455,0 0 0 2px #c5d8ef}
.emotion-stage .emotion-fx .fx{display:none!important} /* no duplicate stars over the eyes */
.mood-theater-ui{position:absolute;z-index:12;bottom:18px;left:50%;transform:translateX(-50%);display:flex;align-items:center;gap:10px;justify-content:center;flex-wrap:wrap;width:max-content;max-width:94%;pointer-events:auto}
.mood-theater-ui button{border:1px solid #ffffff80;background:#fff9;color:#55382d;border-radius:30px;padding:10px 16px;font-weight:750;cursor:pointer;box-shadow:0 4px 18px #321a1a33;font-size:14px}
.mood-theater-ui button:hover{background:white;transform:translateY(-2px)}
.mood-theater-ui .close-theater{background:#59382ed9;color:#fff}
.mood-ambient{position:absolute;inset:0;overflow:hidden;pointer-events:none;z-index:10}
.mood-ambient span{position:absolute;bottom:-12%;left:var(--x);font-size:var(--size);opacity:0;animation:moodRise var(--dur) ease-in var(--delay) infinite;text-shadow:0 0 14px #ffefc5}
.emotion-stage.lonely .mood-ambient span{color:#cde5ff;text-shadow:0 0 12px #cde5ff}
@keyframes moodRise{0%{opacity:0;transform:translateY(0) scale(.7) rotate(-15deg)}20%{opacity:.85}85%{opacity:.65}100%{opacity:0;transform:translateY(-100vh) scale(1.4) rotate(25deg)}}
.emotion-stage:not(.visible) .mood-ambient span{animation-play-state:paused}
@media(max-width:650px){.mood-theater-ui{bottom:8px;gap:6px}.mood-theater-ui button{padding:9px 11px;font-size:12px}}
@media(prefers-reduced-motion:reduce){.mood-ambient span{animation:none!important;display:none}}
</style>
<script>
(()=>{
 const stage=document.querySelector('.emotion-stage');if(!stage)return;
 const ambient=document.createElement('div');ambient.className='mood-ambient';ambient.setAttribute('aria-hidden','true');
 for(let i=0;i<17;i++){
   const el=document.createElement('span');el.style.setProperty('--x',((i*47+13)%100)+'%');
   el.style.setProperty('--size',(13+(i*7)%18)+'px');el.style.setProperty('--dur',(3.2+(i%5)*.6)+'s');
   el.style.setProperty('--delay',(-i*.37)+'s');ambient.appendChild(el);
 }
 stage.appendChild(ambient);
 const ui=document.createElement('div');ui.className='mood-theater-ui';
 ui.innerHTML='<button type="button" id="theaterReplay">↻ 再看一次</button><button type="button" id="theaterSwap">⇄ 換個心情</button><button type="button" class="close-theater" id="theaterClose">✕ 回去陪貓咪</button>';
 stage.appendChild(ui);
 const render=()=>{const sad=stage.classList.contains('lonely');[...ambient.children].forEach((el,i)=>el.textContent=sad?(i%3===0?'♡':'💧'):(i%3===0?'♡':'✦'));};
 const lonely=document.getElementById('lonelyMode'),proud=document.getElementById('proudMode');
 lonely.addEventListener('click',render);proud.addEventListener('click',render);
 const replay=document.getElementById('theaterReplay'),swap=document.getElementById('theaterSwap'),close=document.getElementById('theaterClose');
 replay.onclick=()=>{const sad=stage.classList.contains('lonely');(sad?lonely:proud).click();render()};
 swap.onclick=()=>{(stage.classList.contains('lonely')?proud:lonely).click();render()};
 close.onclick=()=>{stage.className='emotion-stage';};
 document.addEventListener('keydown',e=>{if(e.key==='Escape')close.click()});
 // Allow viewers to watch at their own pace while theater controls are in use.
 const observer=new MutationObserver(()=>{if(stage.classList.contains('visible'))render()});observer.observe(stage,{attributes:true,attributeFilter:['class']});
})();
</script>

<style>
/* 2.0 subtle character-focused micro-animations, no sound */
.emotion-stage.visible .emotion-card img{animation:catBreathe 3.2s ease-in-out infinite;transform-origin:50% 72%}
.emotion-stage.proud.visible .emotion-card img{animation:catCelebrate 1.25s ease-in-out infinite;transform-origin:50% 72%}
@keyframes catBreathe{0%,100%{transform:scale(1) rotate(-.5deg)}50%{transform:scale(1.025) rotate(.5deg)}}
@keyframes catCelebrate{0%,100%{transform:scale(1) translateY(0) rotate(-1deg)}50%{transform:scale(1.035) translateY(-8px) rotate(1deg)}}
.emotion-card .blink-wash{position:absolute;inset:0;pointer-events:none;z-index:5;opacity:0;background:linear-gradient(180deg,transparent 28%,#3d24130a 42%,transparent 60%)}
.emotion-stage.visible .blink-wash{animation:softBlink 6s ease-in-out infinite}
@keyframes softBlink{0%,42%,44%,100%{opacity:0}43%{opacity:.65}}
.emotion-stage.proud .emotion-card::after{content:'✦';position:absolute;left:48%;top:36%;color:#ffe59a;font-size:24px;filter:drop-shadow(0 0 8px #ffbd43);pointer-events:none;z-index:5;animation:eyeShimmer 2s ease-in-out infinite}
@keyframes eyeShimmer{0%,100%{opacity:0;transform:scale(.7)}45%{opacity:.8;transform:scale(1.12)}}
.emotion-stage.lonely .emotion-card::after{content:'♡';position:absolute;right:10%;top:36%;color:#d8e8ff;font-size:22px;pointer-events:none;z-index:5;animation:eyeShimmer 3s ease-in-out infinite}
.emotion-stage .micro-label{position:absolute;z-index:15;top:20px;left:50%;transform:translateX(-50%);color:white;background:#321e1b99;padding:8px 14px;border-radius:40px;font-size:13px;white-space:nowrap;pointer-events:none}
@media(prefers-reduced-motion:reduce){.emotion-stage.visible .emotion-card img,.emotion-stage.visible .blink-wash,.emotion-stage .emotion-card::after{animation:none!important}}
</style>
<script>
(()=>{const stage=document.querySelector('.emotion-stage');if(!stage)return;const card=stage.querySelector('.emotion-card');if(card){const blink=document.createElement('div');blink.className='blink-wash';card.appendChild(blink)}const label=document.createElement('div');label.className='micro-label';label.textContent='✨ 微表情動畫 · 無聲陪伴';stage.appendChild(label)})();
</script>
